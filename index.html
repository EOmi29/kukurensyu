.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.g{background:var(--gr)}.btn.b{background:var(--bl)}.btn.w{background:var(--card);color:var(--tx);border:3px solid var(--bd)}
.btn[disabled]{opacity:.4}
.hb{flex:1;display:flex;gap:4vw;align-items:center;justify-content:center;min-height:0}
.dans{display:grid;grid-template-columns:repeat(3,1fr);gap:2vh 1.5vw;width:42vw}
.dans .btn{font-size:clamp(24px,5.4vh,52px);padding:4.5vh 0}
.modes{display:flex;flex-direction:column;gap:2.5vh;width:40vw}
.modes .btn{font-size:clamp(20px,3.8vh,38px);padding:2.8vh 2vw}.modes small{display:block;font-size:.7em;font-weight:600}
.top{display:flex;align-items:center;gap:2vw}
.top h2{margin:0;font-size:clamp(26px,5vh,48px);flex:1}
.main{flex:1;display:flex;gap:2vw;min-height:0}
.area{flex:1;display:flex;align-items:center;justify-content:center}
.plates{--ps:min(14vw,25vh);display:grid;grid-template-columns:repeat(5,var(--ps));gap:1.5vh 1.5vw}
.quiz .plates{--ps:min(10vw,22vh)}
.plate{width:var(--ps);height:var(--ps);position:relative;background:var(--plate) center/contain no-repeat;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.cand{position:absolute;inset:20%;display:grid;gap:2%;align-content:center;justify-items:center}
.cand i{display:block;width:100%;aspect-ratio:3/2;background:var(--candy) center/contain no-repeat}
.cover{position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(45deg,#4dabf7 0 10px,#74c0fc 10px 20px);border:4px solid var(--bl);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--ps)*.4)}
.say{text-align:center;font-size:clamp(20px,3.8vh,38px);line-height:1.5}
.say .big{display:block;font-size:clamp(40px,10vh,100px);font-weight:800;color:var(--ac)}
.row{display:flex;gap:2vw;justify-content:center}
.lcol{flex:1;display:flex;flex-direction:column;gap:1vh;min-width:0}.panel{width:30vw;display:flex;flex-direction:column;gap:1.4vh;justify-content:center}
.formula{font-size:clamp(34px,8vh,80px);font-weight:800;text-align:center;white-space:nowrap}
.slot{display:inline-block;min-width:1.2em;height:1.4em;line-height:1.4em;text-align:center;border:4px dashed var(--bd);border-radius:14px;background:var(--card);vertical-align:middle}
.slot.on{border:4px solid var(--ac)}
.hint{text-align:center;font-size:clamp(16px,2.8vh,28px);margin:0}
.msg{min-height:1.4em;text-align:center;font-size:clamp(22px,4.4vh,44px);font-weight:800}
.msg.ok{color:var(--gr)}.msg.ng{color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vh 1vw}
.pad .btn{background:var(--card);color:var(--tx);border:3px solid var(--bd);padding:2.2vh 0;font-size:clamp(24px,5vh,48px)}
.story{max-width:100%;box-sizing:border-box;font-size:clamp(26px,5.6vh,54px);line-height:1.8;font-weight:700;padding:3vh 3vw;background:var(--card);border:4px solid var(--bd);border-radius:24px}
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
.res .big{font-size:clamp(50px,14vh,140px);font-weight:800;color:var(--ac)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let S={};
const hdr=t=>`<div class="top"><button class="btn w" onclick="home()">← もどる</button><h2>${t}</h2></div>`;
function plates(n,k,vis){
  const c=n<=1?1:n<=4?2:3;let h='';
  for(let i=0;i<k;i++)h+=`<div class="plate"><div class="cand" style="grid-template-columns:repeat(${c},1fr)">${'<i></i>'.repeat(n)}</div>${i>=vis?'<div class="cover">？</div>':''}</div>`;
  return `<div class="plates">${h}</div>`;
}
function home(){
  S={};
  $('#app').innerHTML=`<h1>かけざんの しきを たてよう</h1><p class="sub">れんしゅうする だんを えらんでね</p>
  <div class="hb"><div class="dans">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="btn" onclick="study(${d},1)">${d}の だん</button>`).join('')}</div>
  <div class="modes"><button class="btn g" onclick="quiz('shiki')">しきを たてよう</button><button class="btn b" onclick="pick('ans')">九九の こたえは なあに？</button><button class="btn" onclick="quiz('sto1')">おはなしもんだい<small>しきを たてよう</small></button><button class="btn" style="background:#7048e8" onclick="quiz('sto2')">おはなしもんだい<small>しきと こたえ</small></button></div></div>`;
}
function study(d,s){
  S={mode:'study',d};
  $('#app').innerHTML=hdr(`${d}の だん`)+`<div class="main"><div class="area">${plates(d,s,s)}</div></div>
  <div class="say">あめ ${d}こが ${s}さら<span class="big">${d} × ${s} = ${d*s}</span>あわせて ${d*s}こ</div>
  <div class="row"><button class="btn w" ${s<2?'disabled':''} onclick="study(${d},${s-1})">ひとつ もどる</button>
  ${s<9?`<button class="btn" onclick="study(${d},${s+1})">つぎの おさら ＋</button>`:`<button class="btn g" onclick="quiz('dan',${d})">もんだいに ちょうせん！</button>`}</div>`;
}
const B=x=>x;
const PT=[
(n,k)=>`あめが ${B(n)}こ のっている おさらが ${B(k)}まい あります。あめは ぜんぶで なんこ ですか。`,
(n,k)=>`クッキーが ${B(n)}まい はいった ふくろが ${B(k)}ふくろ あります。クッキーは ぜんぶで なんまい ですか。`,
(n,k)=>`おはなが ${B(n)}りん さいている かだんが ${B(k)}こ あります。おはなは ぜんぶで なんりん さいていますか。`,
(n,k)=>`クリップを 1人に ${B(n)}こ ずつ くばります。${B(k)}人に くばるには、クリップは なんこ いるでしょうか。`,
(n,k)=>`1つの はこに チョコレートが ${B(n)}こ ずつ はいっています。はこが ${B(k)}はこ あると、チョコレートは ぜんぶで なんこ ですか。`,
(n,k)=>`いすが 1れつに ${B(n)}きゃく ならんでいます。${B(k)}れつ あると、いすは ぜんぶで なんきゃく ですか。`,
(n,k)=>`1だいの バスに ${B(n)}人 のれます。バスが ${B(k)}だい あると、ぜんぶで なん人 のれますか。`,
(n,k)=>`1つの かごに りんごが ${B(n)}こ はいっています。かごが ${B(k)}こ あると、りんごは ぜんぶで なんこ ですか。`,
(n,k)=>`1人に シールを ${B(n)}まい ずつ あげます。${B(k)}人に あげるには、シールは なんまい いりますか。`,
(n,k)=>`1つの テーブルに こどもが ${B(n)}人 ずつ すわります。テーブルが ${B(k)}つ あると、こどもは ぜんぶで なん人 ですか。`
];
const story=q=>`<div class="story">${PT[q.p](q.n,q.k)}</div>`;
function pick(mode){S={mode:'pick',tg:mode,sel:[]};drawPick();}
function drawPick(){
  $('#app').innerHTML=hdr('どの だんを れんしゅう する？')+`<div class="hb"><div class="dans">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="btn ${S.sel.includes(d)?'':'w'}" onclick="tg(${d})">${S.sel.includes(d)?'✓ ':''}${d}の だん</button>`).join('')}</div>
  <div class="modes"><p class="sub">いくつでも えらべるよ</p><button class="btn g" ${S.sel.length?'':'disabled'} onclick="go(false)">えらんだ だんで はじめる</button><button class="btn b" onclick="go(true)">ランダムで はじめる</button></div></div>`;
}
function tg(d){const i=S.sel.indexOf(d);if(i<0)S.sel.push(d);else S.sel.splice(i,1);drawPick();}
function go(r){quiz(S.tg,null,r?null:S.sel.slice());}
function quiz(mode,d,ds){S={mode,d,ds,i:0,ok:0,N:mode=='dan'?5:10};nextQ();}
function nextQ(){
  if(S.i>=S.N)return result();
  const m=S.mode,st=m.startsWith('sto'),n=S.d||(S.ds?S.ds[R(0,S.ds.length-1)]:R(2,9));
  const k=m=='ans'?R(3,9):st?R(2,9):R(1,9);
  const vis=m=='ans'&&Math.random()<.6?R(1,k-1):k;
  S.q={n,k,vis,a:'',b:'',a2:'',ph:1,p:st?(S.lp=((S.lp??-1)+R(1,PT.length-1))%PT.length):0,cur:0,first:true,done:false,msg:'',cls:''};
  draw();
}
function draw(){
  const q=S.q,m=S.mode,st=m.startsWith('sto');let f,hint;
  if(st&&q.ph==2){f=`${q.n} × ${q.k} = <span class="slot on">${q.a2}</span>`;hint='しきは あっているよ。こたえは いくつ かな？';}else if(m=='ans'){
    f=`${q.n} × ${q.k} = <span class="slot on">${q.a}</span>`;
    hint=q.vis<q.k?'かくれて いる おさらも あるよ。かけざんで こたえを だそう！':'ぜんぶで なんこ かな？';
  }else{
    f=`<span class="slot ${q.cur==0?'on':''}" onclick="sel(0)">${q.a}</span> × <span class="slot ${q.cur==1?'on':''}" onclick="sel(1)">${q.b}</span>${m=='sto2'?` = <span class="slot ${q.cur==2?'on':''}" onclick="sel(2)">${q.a2}</span>`:''}`;
    hint=m=='sto2'?'1つぶんの かず × いくつぶん ＝ ぜんぶの かず':st?'1つぶんの かず × いくつぶん':'あめの かず × おさらの かず';
  }
  $('#app').innerHTML=hdr(`もんだい ${S.i+1} / ${S.N}`)+`<div class="main quiz"><div class="lcol"><div class="area">${st?story(q):plates(q.n,q.k,q.vis)}</div><div class="formula">${f}</div><p class="hint">${hint}</p><div class="msg ${q.cls}">${q.msg}</div></div>
  <div class="panel">
  ${q.done?`<button class="btn g" onclick="S.i++;nextQ()">つぎへ →</button>`:`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="btn" onclick="key(${d})">${d}</button>`).join('')}<button class="btn w" onclick="clr()">けす</button><button class="btn" onclick="key(0)">0</button><button class="btn g" style="background:var(--gr);color:#fff;border:0;font-size:clamp(15px,2.8vh,28px)" onclick="chk()">こたえ<br>あわせ</button></div>
  `}</div></div>`;
}
function sel(i){if(S.q.done)return;S.q.cur=i;if(i==2)S.q.a2='';draw();}
function key(d){
  const q=S.q;q.msg='';q.cls='';
  if(q.cur==2){if(q.a2.length<2)q.a2+=d;}else if(S.mode=='ans'){if(q.a.length<2)q.a+=d;}
  else{if(q.cur==0){q.a=''+d;q.cur=1;}else{q.b=''+d;if(S.mode=='sto2')q.cur=2;}}
  draw();
}
function clr(){const q=S.q;q.a='';q.b='';q.a2='';q.cur=0;q.msg='';q.cls='';draw();}
function chk(){
  const q=S.q;if(q.ph==2){if(q.a2==='')return;if(+q.a2==q.n*q.k){q.done=true;q.cls='ok';q.msg=`せいかい！ ${q.n} × ${q.k} = ${q.n*q.k}`;if(q.first)S.ok++;}else{q.first=false;q.cls='ng';q.msg='もういちど けいさん してみよう';}return draw();}if(q.a===''||(S.mode!='ans'&&q.b==='')||(S.mode=='sto2'&&q.a2===''))return;
  let ok,hint='';
  if(S.mode=='ans')ok=+q.a==q.n*q.k;
  else{ok=+q.a==q.n&&+q.b==q.k;if(ok&&S.mode=='sto2'&&+q.a2!=q.n*q.k){ok=false;hint='しきは あっているよ。こたえを もういちど けいさんしよう';}else if(!ok&&+q.a==q.k&&+q.b==q.n)hint=S.mode.startsWith('sto')?'1つぶんの かずが さきだよ。いれかえてみよう':'あめの かずが さきだよ。いれかえてみよう';}
  if(ok){q.done=true;q.cls='ok';q.msg=`せいかい！ ${q.n} × ${q.k} = ${q.n*q.k}`;if(q.first)S.ok++;}
  else{q.first=false;q.cls='ng';q.msg=hint||'もういちど かんがえよう';}
  draw();
}
function result(){
  const r=S.ok/S.N;
  $('#app').innerHTML=`<div class="res"><h1>おつかれさま！</h1><div class="big">${S.ok} / ${S.N}</div>
  <div class="say">${r>=.8?'すごい！ よく できました ⭐':r>=.5?'いいね！ もうすこしで かんぺき':'なんども れんしゅうすれば できるよ'}</div>
  <div class="row"><button class="btn g" onclick="quiz('${S.mode}',${S.d||'null'},${JSON.stringify(S.ds||null)})">もういちど</button><button class="btn w" onclick="home()">ホームへ</button></div></div>`;
}
home();
</script></body></html>
